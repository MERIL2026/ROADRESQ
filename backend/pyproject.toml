[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "roadresq-backend"
version = "0.1.0"
description = "RoadResQ Roadside Assistance Backend Service"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLR2004", "E501"]
"alembic/*" = ["E501"]
"app/api/*" = ["PLR0913", "PLR0917", "E501"]
"app/services/*" = ["PLR0913", "PLR0917", "E501"]




[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

