name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/customer-web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/customer-web/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build-and-lint:
    name: Customer Web Lint, Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/customer-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/customer-web/package.json'

      - name: Install Dependencies
        run: npm install

      - name: Run Type Check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build Check
        run: npm run build
